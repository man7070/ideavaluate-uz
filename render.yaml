services:
  - type: web
    name: ideavaluate-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn server:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PERPLEXITY_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
